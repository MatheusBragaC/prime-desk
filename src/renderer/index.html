<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Prime Desk</title>
    <!--
      `unsafe-inline` em style é exigido pelo Tailwind/framer-motion; o resto é
      fechado. `object-src`/`frame-src` cortam plugin e iframe, `base-uri` impede
      reescrever a base de resolução dos caminhos e `form-action` bloqueia POST
      para fora — que era a rota de navegação que sobrava para o renderer.
    -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'; object-src 'none'; frame-src 'none'; child-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
