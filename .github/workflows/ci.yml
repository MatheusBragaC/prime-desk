name: check

# A catraca contra regressão. Ver CONTRIBUTING.md e docs/auditoria/README.md.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts pula o postinstall (electron-builder install-app-deps), que compila
      # node-pty do zero e levava ~7min. O binário nativo só é necessário para EXECUTAR o app:
      # lint, tsc, os testes de lib pura e o bundle do electron-vite não tocam nele.
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run test
      - run: npm run build
