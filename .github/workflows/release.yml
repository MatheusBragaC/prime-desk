name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Necessário para o GITHUB_TOKEN nativo criar/atualizar a Release e anexar assets.
permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    # Heap maior evita o OOM (SIGKILL 137) do bundle do renderer no vite.
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (main + preload + renderer)
        run: npx electron-vite build

      # O `@electron/rebuild` invocado pelo electron-builder trava indefinidamente
      # (worker do node-gyp fica pendurado em "preparing node-pty" sem nunca chamar
      # o compilador). Compilamos o único modulo nativo (node-pty) direto contra a
      # ABI do Electron e depois empacotamos com npmRebuild=false. O `timeout`
      # garante que um eventual travamento falhe rapido em vez de gastar minutos de CI.
      - name: Rebuild node-pty contra a ABI do Electron
        run: |
          set -euo pipefail
          ELECTRON_VERSION="$(node -p "require('electron/package.json').version")"
          echo "Recompilando node-pty para Electron $ELECTRON_VERSION"
          NODE_GYP="$PWD/node_modules/.bin/node-gyp"
          ( cd node_modules/node-pty && timeout 300 "$NODE_GYP" rebuild \
              --target="$ELECTRON_VERSION" \
              --arch=x64 \
              --dist-url=https://electronjs.org/headers \
              --runtime=electron )

      - name: Empacotar .deb + AppImage (sem rebuild)
        run: timeout 900 npx electron-builder --linux deb AppImage -c.npmRebuild=false --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            release/*.deb
            release/*.AppImage

      # Em push de tag `v*`, anexa .deb e AppImage como assets da Release.
      # É o que o `scripts/install.sh` consome (releases/latest). Sem isto, o
      # pacote só existe como artefato de CI (zip, com login e retenção curta).
      - name: Publicar assets na Release (só em tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.deb
            release/*.AppImage

  macos:
    # O dmg só pode ser gerado em macOS: dmg-license é darwin-only e o
    # empacotamento usa hdiutil. Runner arm64 cobre Apple Silicon e Intel.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-vite build
      - run: npx electron-builder --mac dmg zip --x64 --arm64 --publish never
        env:
          # Preencha estes segredos para assinar e notarizar. Sem eles o build
          # sai não assinado e o Gatekeeper exige liberação manual.
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            release/*.dmg
            release/*.zip

      # Anexa .dmg e .zip na mesma Release da tag (a action cria se não existir
      # e atualiza se já existir — os dois jobs escrevem na mesma release).
      - name: Publicar assets na Release (só em tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.zip
