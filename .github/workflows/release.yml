name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Necessário para o GITHUB_TOKEN nativo criar/atualizar a Release e anexar assets.
permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    # Heap maior evita o OOM (SIGKILL 137) do bundle do renderer no vite.
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts pula o postinstall (electron-builder install-app-deps), que
      # recompila o node-pty via @electron/rebuild e trava/consome ~7min. O binario
      # nativo e gerado no passo dedicado abaixo (node-gyp contra a ABI do Electron),
      # entao o postinstall aqui e redundante.
      - run: npm ci --ignore-scripts
      - name: Build (main + preload + renderer)
        run: npx electron-vite build

      # O `@electron/rebuild` invocado pelo electron-builder trava indefinidamente
      # (worker do node-gyp fica pendurado em "preparing node-pty" sem nunca chamar
      # o compilador). Compilamos o único modulo nativo (node-pty) direto contra a
      # ABI do Electron e depois empacotamos com npmRebuild=false. O `timeout`
      # garante que um eventual travamento falhe rapido em vez de gastar minutos de CI.
      - name: Rebuild node-pty contra a ABI do Electron
        run: |
          set -euo pipefail
          ELECTRON_VERSION="$(node -p "require('electron/package.json').version")"
          echo "Recompilando node-pty para Electron $ELECTRON_VERSION"
          NODE_GYP="$PWD/node_modules/.bin/node-gyp"
          ( cd node_modules/node-pty && timeout 300 "$NODE_GYP" rebuild \
              --target="$ELECTRON_VERSION" \
              --arch=x64 \
              --dist-url=https://electronjs.org/headers \
              --runtime=electron )

      - name: Empacotar .deb + AppImage (sem rebuild)
        run: timeout 900 npx electron-builder --linux deb AppImage -c.npmRebuild=false --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            release/*.deb
            release/*.AppImage

      # Em push de tag `v*`, anexa .deb e AppImage como assets da Release.
      # É o que o `scripts/install.sh` consome (releases/latest). Sem isto, o
      # pacote só existe como artefato de CI (zip, com login e retenção curta).
      # O `curl | sh` do README instala sem conferir integridade. Com o
      # checksum publicado, quem quiser conferir tem contra o que comparar.
      - name: Gerar SHA256SUMS
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd release
          sha256sum *.deb *.AppImage > SHA256SUMS-linux.txt
          cat SHA256SUMS-linux.txt

      # Em push de tag `v*`, anexa .deb, AppImage, checksum e o metadado de
      # versão. O `latest-linux.yml` é o que a checagem de update do app usa
      # como alternativa ao releases/latest, e o electron-builder já o gera —
      # antes ele ficava só no runner e era descartado.
      - name: Publicar assets na Release (só em tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.deb
            release/*.AppImage
            release/SHA256SUMS-linux.txt
            release/latest-linux.yml

  macos:
    # O dmg só pode ser gerado em macOS: dmg-license é darwin-only e o
    # empacotamento usa hdiutil. Runner arm64 cobre Apple Silicon e Intel.
    runs-on: macos-14
    # Segredos de assinatura no nível do job: os dois passos de empacotamento
    # (arm64 e x64) usam os mesmos. Sem eles o build sai nao assinado e o
    # Gatekeeper exige liberacao manual.
    env:
      CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Mesmo motivo do linux: pula o postinstall (electron-builder install-app-deps),
      # que recompila node-pty via @electron/rebuild e trava/consome ~7min. O binario
      # nativo e gerado nos passos dedicados abaixo, por arquitetura.
      - run: npm ci --ignore-scripts
      - run: npx electron-vite build

      # Um unico pty.node nao serve para as duas arches, entao compilamos e
      # empacotamos arm64 e x64 separadamente, sempre com npmRebuild=false para
      # nao cair no @electron/rebuild que trava.
      # Sem `timeout` do shell: e do GNU coreutils e nao existe no macOS (exit 127).
      # O limite vem do `timeout-minutes` nativo do GitHub Actions.
      - name: Empacotar macOS arm64 (rebuild node-pty + package)
        timeout-minutes: 25
        run: |
          set -euo pipefail
          ELECTRON_VERSION="$(node -p "require('electron/package.json').version")"
          NODE_GYP="$PWD/node_modules/.bin/node-gyp"
          ( cd node_modules/node-pty && "$NODE_GYP" rebuild \
              --target="$ELECTRON_VERSION" \
              --arch=arm64 \
              --dist-url=https://electronjs.org/headers \
              --runtime=electron )
          npx electron-builder --mac dmg zip --arm64 -c.npmRebuild=false --publish never

      - name: Empacotar macOS x64 (rebuild node-pty + package)
        timeout-minutes: 25
        run: |
          set -euo pipefail
          ELECTRON_VERSION="$(node -p "require('electron/package.json').version")"
          NODE_GYP="$PWD/node_modules/.bin/node-gyp"
          ( cd node_modules/node-pty && "$NODE_GYP" rebuild \
              --target="$ELECTRON_VERSION" \
              --arch=x64 \
              --dist-url=https://electronjs.org/headers \
              --runtime=electron )
          npx electron-builder --mac dmg zip --x64 -c.npmRebuild=false --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            release/*.dmg
            release/*.zip

      # Anexa .dmg e .zip na mesma Release da tag (a action cria se não existir
      # e atualiza se já existir — os dois jobs escrevem na mesma release).
      - name: Gerar SHA256SUMS
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd release
          shasum -a 256 *.dmg *.zip > SHA256SUMS-macos.txt
          cat SHA256SUMS-macos.txt

      - name: Publicar assets na Release (só em tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.zip
            release/SHA256SUMS-macos.txt
            release/latest-mac.yml
